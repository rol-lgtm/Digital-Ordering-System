<!DOCTYPE html>
<html>
<head>
    <title>CU Dine-In</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f7f7f7;
        }

        header {
            height: 150px;
            background: white;
            border-bottom: 4px solid #b5121b;
            padding: 10px 7%;
        }

        .CUlogo {

        	height: 120px;
        	display: block;
        	margin-left: auto;
        	margin-right: auto;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1, h2 {
            color: #b5121b;
        }

        .slideshow {
            position: relative;
            height: 300px;
            overflow: hidden;
            border-radius: 10px;
        }

        .slide {
            display: none;
            height: 100%;
            position: relative;
        }

        .slide.active {
            display: block;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .caption {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 20px;
            color: white;
            background: rgba(0,0,0,.6);
            font-size: 22px;
        }

        .arrow {
            position: absolute;
            top: 45%;
            background: #b5121b;
            color: white;
            border: 0;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        .prev { left: 10px; }
        .next { right: 10px; }

        /* FOOD CARDS */
        .foods {
            display: flex;
            gap: 15px;
        }

        .card {
            background: white;
            flex: 1;
            padding-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px #ddd;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .card h3,
        .card p {
            margin-left: 15px;
        }

        .price {
            color: #b5121b;
            font-weight: bold;
        }

        .add {
            background: #b5121b;
            color: white;
            border: 0;
            padding: 8px 15px;
            margin-left: 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .add:hover {
            background: #8d0d14;
        }

        /* TABLES */
        .tables {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .table {
            padding: 10px 18px;
            background: white;
            border: 1px solid #ccc;
            cursor: pointer;
            border-radius: 5px;
        }

        .table.selected {
            background: #b5121b;
            color: white;
        }

        /* ORDER */
        .order {
            margin-top: 25px;
            padding: 15px;
            background: #b5121b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
        }

        .continue {
            background: white;
            color: #b5121b;
            border: 0;
            padding: 9px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        @media(max-width: 700px) {
            .foods {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
    	<img class="CUlogo" src="cu.png" alt="Cu Logo">
    </div>
</header>

<div class="container">

    <h1>Dine-In</h1>
    <p>Choose your food and table.</p>

    <!-- SLIDESHOW -->
    <div class="slideshow">

        <div class="slide active">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=1000" alt="Burger">
            <div class="caption">Classic Burger</div>
        </div>

        <div class="slide">
            <img src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=1000" alt="Pizza">
            <div class="caption">Cheese Pizza</div>
        </div>

        <div class="slide">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=1000" alt="Rice Bowl">
            <div class="caption">Healthy Rice Bowl</div>
        </div>

        <button class="arrow prev" onclick="changeSlide(-1)">❮</button>
        <button class="arrow next" onclick="changeSlide(1)">❯</button>

    </div>


    <h2>Popular Meals</h2>

    <div class="foods">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500">
            <h3>Classic Burger</h3>
            <p class="price">₱249</p>
            <button class="add" onclick="addFood('Classic Burger',249)">
                Add
            </button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=500">
            <h3>Cheese Pizza</h3>
            <p class="price">₱299</p>
            <button class="add" onclick="addFood('Cheese Pizza',299)">
                Add
            </button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500">
            <h3>Rice Bowl</h3>
            <p class="price">₱189</p>
            <button class="add" onclick="addFood('Rice Bowl',189)">
                Add
            </button>
        </div>

    </div>

    <h2>Select Table</h2>

    <div class="tables">

        <button class="table" onclick="selectTable(this)">
            Table 1
        </button>

        <button class="table" onclick="selectTable(this)">
            Table 2
        </button>

        <button class="table" onclick="selectTable(this)">
            Table 3
        </button>

        <button class="table" onclick="selectTable(this)">
            Table 4
        </button>

    </div>


    <!-- ORDER -->
    <div class="order">

        <div>
            Items: <span id="items">0</span>
            |
            Total: ₱<span id="total">0</span>
        </div>

        <button class="continue" onclick="continueOrder()">
            Continue
        </button>

    </div>

</div>


<script>

    let slideIndex = 0;

    const slides = document.querySelectorAll(".slide");

    function changeSlide(direction) {

        slides[slideIndex].classList.remove("active");

        slideIndex += direction;

        if (slideIndex >= slides.length) {
            slideIndex = 0;
        }

        if (slideIndex < 0) {
            slideIndex = slides.length - 1;
        }

        slides[slideIndex].classList.add("active");
    }

    let items = 0;
    let total = 0;
    let order = [];


    function addFood(name, price) {

        items++;
        total += price;

        order.push({
            name: name,
            price: price
        });

        updateOrder();

        alert(name + " added!");
    }


    function updateOrder() {

        document.getElementById("items").textContent = items;

        document.getElementById("total").textContent = total;

    }

    let selectedTable = "";

    function selectTable(button) {

        document.querySelectorAll(".table")
            .forEach(btn => {
                btn.classList.remove("selected");
            });

        button.classList.add("selected");

        selectedTable = button.textContent.trim();
    }


    function continueOrder() {

        if (items === 0) {
            alert("Please add food first.");
            return;
        }

        if (selectedTable === "") {
            alert("Please select a table.");
            return;
        }

        let message =
            "ORDER SUMMARY\n\n" +
            "Table: " + selectedTable + "\n\n";

        order.forEach(item => {
            message += item.name + " - ₱" + item.price + "\n";
        });

        message +=
            "\nItems: " + items +
            "\nTotal: ₱" + total;

        alert(message);
    }

</script>

</body>
</html>
