<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CU FoodHub</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background-color: red;
      padding: 150px;
    }

    .logo {
      position: absolute;
      top: 20px;
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    .logo-left {
      left: 250px;
    }

    .logo-right {
      right: 250px;
    }

    .card {
      background-color: white;
      border: 2px solid black;
      max-width: 500px;
      margin: 40px auto;
      padding: 40px;
    }

    h3 {
      color: black;
      margin-top: 0;
      text-align: center;
    }

    iframe {
      width: 100%;
    }

    p {
      color: gray;
      line-height: 1.5;
    }

    .button {
      display: block;
      background-color: red;
      color: white;
      text-align: center;
      font-size: 20px;
      padding: 15px;
      border-radius: 4px;
    }

    .button:hover {
      background-color: green;
    }

    @media (max-width: 1024px) {

      body {
        background-color: green;
        padding: 30px 24px;
      }

      .logos {
        text-align: center;
      }

      .logo {
        position: static;
        width: 120px;
        height: 120px;
        margin: 0 20px;
      }

      .card {
        padding: 32px;
      }
    }

    @media (max-width: 600px) {

      body {
        background-color: white;
        padding: 16px 12px;
      }

      .logo {
        width: 80px;
        height: 80px;
        margin: 0 10px;
      }

      .card {
        padding: 20px;
      }

      h3 {
        font-size: 18px;
      }

      p {
        font-size: 14px;
      }

      .button {
        font-size: 18px;
      }
    }

  </style>
</head>
<body>

    <div class="logos">
        <img class="logo logo-left" src="cu.png" alt="Capitol University logo">
        <img class="logo logo-right" src="cs.png" alt="Computer Studies logo">
    </div>

      <div class="card">
        <h3>Capitol University FoodHub: Digital Ordering System</h3>

       <iframe width="560" height="315" src="https://www.youtube.com/embed/r7AGYk2_FPI?si=W8zsoF7xUwgpCjcL" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <p>NOTE: If you’re not familiar with the digital ordering system, watch the video first it only takes about a minute or skip the video and go straight to your order.</p>


        <a class="button" href="barrosPage2.html">Start order</a>
      </div>

</body>
</html>
